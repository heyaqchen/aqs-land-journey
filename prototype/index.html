</style><link rel="stylesheet" href="entry.css?v=2"><link rel="stylesheet" href="onboarding.css?v=2"></head><body class="booting"><section id="entry" aria-label="应用启动"></section><main aria-label="AdvanCE 学习首页"><header><div class="logo">AdvanCE<span class="brand-bang">!</span></div><nav class="tools" aria-label="快捷入口"><button class="icon" data-open="messages" aria-label="消息通知"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg></button><button class="icon" data-open="calendar" aria-label="计划表"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 10h16m-12 4h2m4 0h2m-8 3h2"/></svg></button></nav></header><section class="screen" aria-label="个人学习屏幕"><div class="profile"><div class="avatar" aria-label="用户头像"><svg viewBox="0 0 32 32"><circle cx="16" cy="11" r="5"/><path d="M6 27c0-10 20-10 20 0"/></svg></div><div><p class="greeting">hi，<span id="username">同学</span></p><p class="signature" id="signature">慢慢来，每一步都算数。</p></div></div><div class="widgets"><button class="widget" aria-label="添加第一个小组件"><span class="plus">+</span></button><button class="widget" aria-label="添加第二个小组件"><span class="plus">+</span></button><button class="widget" aria-label="添加第三个小组件"><span class="plus">+</span></button></div><button class="widget-manage" id="manageWidgets" hidden>管理小组件</button></section><section class="controls" aria-label="选择学习模式"><div class="dpad"><button class="mode up" data-mode="游戏模式" aria-pressed="false">游戏<br>模式</button><button class="mode left" data-mode="平时练习" aria-pressed="false">平时<br>练习</button><button class="confirm" id="confirm">确认</button><button class="mode right" data-mode="考场模拟" aria-pressed="false">考场<br>模拟</button><button class="mode down" data-mode="无限模式" aria-pressed="false">无限<br>模式</button></div><button class="end" data-open="summary">今日<br>结束</button></section><div class="bottom"><div class="split-wrap"><div class="split"><button data-open="community" id="communityButton">社区</button><button data-open="settings">设置</button></div></div><button class="vertical" data-open="mine" aria-label="我的">我<br>的</button></div><div class="status" id="status" aria-live="polite"></div><div class="foot"></div></main><dialog id="modal"><div class="dialoghead"><h2 id="title"></h2><button class="close" aria-label="关闭弹窗">×</button></div><div class="content" id="content"></div></dialog><script>
const modal=document.querySelector('#modal'),content=document.querySelector('#content'),title=document.querySelector('#title');let selected='',currentWidget=null;function show(t,html){modal.classList.toggle('profile-editor',t==='个人设置');title.textContent=t;content.innerHTML=html;modal.showModal()}document.querySelector('.close').onclick=()=>modal.close();modal.onclick=e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}};
const knowledgeQuotes=[
  'since 表示时间起点，for 表示持续的时间长度。',
  '虚拟语气中，If I were you 常与 would 搭配。',
  '现在完成时强调过去发生的事与现在的联系。',
  '阅读题先找题干关键词，再回原文定位。',
  '错题复盘时，先写清错误原因，再看正确答案。',
  '英语一般疑问句常把助动词放在主语之前。',
  '做选择题时，可以先排除明显不符合题意的选项。',
  '简答题先回应问题，再用依据补充说明。',
  '过去进行时常表示过去某时正在发生的动作。',
  '比较级通常用于两者之间的比较。',
  '复习间隔拉开一些，比一次重复很多遍更利于记忆。',
  '检查答案时，特别留意题干中的否定词和范围词。'
];
function localDayKey(date=new Date()){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function renderDailyQuote(widget){const today=localDayKey();const start=new Date(2026,0,1);const now=new Date();const dayIndex=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-start)/86400000);const quote=knowledgeQuotes[((dayIndex%knowledgeQuotes.length)+knowledgeQuotes.length)%knowledgeQuotes.length];widget.classList.add('chosen','daily-quote');widget.dataset.widget='dailyQuote';widget.dataset.quoteDate=today;widget.replaceChildren();const label=document.createElement('span'),text=document.createElement('span');label.className='quote-label';label.textContent='每日一句 · '+today;text.className='quote-text';text.textContent=quote;widget.append(label,text)}
function restoreDailyQuotes(){let slots=[];try{slots=JSON.parse(localStorage.getItem('advance-demo-daily-quote-slots')||'[]')}catch{}document.querySelectorAll('.widget').forEach((widget,index)=>{if(slots.includes(index))renderDailyQuote(widget)})}
function saveDailyQuoteSlots(){const slots=[...document.querySelectorAll('.widget')].flatMap((widget,index)=>widget.dataset.widget==='dailyQuote'?[index]:[]);localStorage.setItem('advance-demo-daily-quote-slots',JSON.stringify(slots))}
function updateWidgetVisibility(){const widgets=[...document.querySelectorAll('.widget')],hidden=widgets.flatMap((widget,index)=>widget.hidden?[index]:[]);localStorage.setItem('advance-hidden-widget-slots',JSON.stringify(hidden));document.querySelector('#manageWidgets').hidden=hidden.length===0;document.querySelector('.screen').classList.toggle('widgets-empty',hidden.length===widgets.length)}
function setWidgetHidden(widget,hidden){widget.hidden=hidden;updateWidgetVisibility()}
function restoreHiddenWidgets(){let hidden=[];try{hidden=JSON.parse(localStorage.getItem('advance-hidden-widget-slots')||'[]')}catch{}document.querySelectorAll('.widget').forEach((widget,index)=>widget.hidden=hidden.includes(index));updateWidgetVisibility()}
document.querySelector('#manageWidgets').onclick=()=>{const hidden=[...document.querySelectorAll('.widget')].flatMap((widget,index)=>widget.hidden?[index]:[]);show('管理小组件','<p class="quiet">选择一个空白位置，重新添加小组件。</p>'+hidden.map(index=>'<button class="action" data-restore="'+index+'">第 '+(index+1)+' 个位置 · 添加小组件</button>').join(''));document.querySelectorAll('[data-restore]').forEach(button=>button.onclick=()=>{const widget=document.querySelectorAll('.widget')[Number(button.dataset.restore)];setWidgetHidden(widget,false);modal.close();widget.click()})};
function applyCommunity(){let profile={};try{profile=JSON.parse(localStorage.getItem('advance-demo-profile')||'{}')}catch{}const enabled=profile.communityEnabled!==false;document.querySelector('#communityButton').hidden=!enabled;document.querySelector('.split-wrap').classList.toggle('community-off',!enabled)}
const views={mine:()=>{let p={};try{p=JSON.parse(localStorage.getItem('advance-demo-profile')||'{}')}catch{}show('我的','<div class="profile-edit-avatar"><div class="avatar-preview" id="myAvatarPreview"></div><label for="myAvatarChoice">选择头像</label><select id="myAvatarChoice"><option value="🌱">🌱 清新</option><option value="📚">📚 阅读</option><option value="🐼">🐼 熊猫</option><option value="⭐">⭐ 星星</option><option value="🎮">🎮 游戏</option></select></div><label for="myNameInput">昵称</label><input id="myNameInput" maxlength="12"><label for="myBioInput">个性签名</label><input id="myBioInput" maxlength="30"><label class="community-switch" for="communityEnabled"><span>在首页显示社区入口</span><input id="communityEnabled" type="checkbox"></label><button class="action" id="saveMine">保存资料</button>');const choice=document.querySelector('#myAvatarChoice'),preview=document.querySelector('#myAvatarPreview');choice.value=p.avatar||'🌱';preview.textContent=choice.value;choice.onchange=()=>preview.textContent=choice.value;document.querySelector('#myNameInput').value=p.name||document.querySelector('#username').textContent;document.querySelector('#myBioInput').value=p.bio||document.querySelector('#signature').textContent;document.querySelector('#communityEnabled').checked=p.communityEnabled!==false;document.querySelector('#saveMine').onclick=()=>{p.name=document.querySelector('#myNameInput').value.trim()||'同学';p.bio=document.querySelector('#myBioInput').value.trim();p.avatar=choice.value;p.communityEnabled=document.querySelector('#communityEnabled').checked;localStorage.setItem('advance-demo-profile',JSON.stringify(p));document.querySelector('#username').textContent=p.name;document.querySelector('#signature').textContent=p.bio;const avatar=document.querySelector('.profile .avatar');avatar.textContent=p.avatar;avatar.classList.add('avatar-emoji');applyCommunity();modal.close();document.querySelector('#status').textContent='个人资料已保存'}},messages:()=>show('消息通知','<div class="empty">暂时没有新消息<p class="quiet">安心学习，消息会在这里等你。</p></div>'),calendar:()=>{location.href='plans.html'},settings:()=>{show('个人设置','<label for="name">用户名</label><input id="name" maxlength="12"><label for="bio">个性签名</label><input id="bio" maxlength="30"><button class="action" id="saveProfile">保存</button>');document.querySelector('#name').value=document.querySelector('#username').textContent;document.querySelector('#bio').value=document.querySelector('#signature').textContent;document.querySelector('#saveProfile').onclick=()=>{document.querySelector('#username').textContent=document.querySelector('#name').value.trim()||'同学';document.querySelector('#signature').textContent=document.querySelector('#bio').value.trim();modal.close()}},summary:()=>{location.href='summary.html'},community:()=>show('社区','<div class="empty">学习路上，一起前进。<p class="quiet">社区内容将在后续版本加入。</p></div>')};applyCommunity();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(b.dataset.open==='settings'){location.href='settings.html';return}views[b.dataset.open]()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{selected=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#status').textContent='已选择'+selected});document.querySelector('#confirm').onclick=()=>{if(selected==='平时练习'){location.href='practice.html';return}if(selected==='考场模拟'){location.href='exam.html';return}if(selected==='无限模式'){location.href='infinite.html';return}if(selected==='游戏模式'){location.href='game.html';return}if(!selected){document.querySelector('#status').textContent='请先选择一种学习模式';return}show(selected,'<p>准备好开始了吗？</p><p class="quiet">你已进入'+selected+'。具体学习内容将在后续版本接入。</p><button class="action" onclick="modal.close()">返回首页</button>')};document.querySelectorAll('.widget').forEach(w=>w.onclick=()=>{currentWidget=w;show('添加小组件','<p class="quiet">选择一个小组件，试试首页布局。</p><button class="action" id="countdown">倒计时</button><button class="action" id="planWidget">今日计划</button><button class="action" id="dailyQuoteWidget">每日一句</button><button class="action" id="removeWidget">保持空白</button>');document.querySelector('#countdown').onclick=()=>{show('设置倒计时','<label for="event">目标名称</label><input id="event" maxlength="12" placeholder="例如：期末考试"><label for="date">目标日期</label><input id="date" type="date"><button class="action" id="addCount">添加</button>');document.querySelector('#addCount').onclick=()=>{const date=document.querySelector('#date').value;if(!date){document.querySelector('#date').focus();return}const days=Math.max(0,Math.ceil((new Date(date+'T00:00:00')-new Date())/86400000));currentWidget.dataset.widget='';currentWidget.classList.remove('daily-quote');saveDailyQuoteSlots();currentWidget.textContent=(document.querySelector('#event').value.trim()||'目标日')+' · 还有 '+days+' 天';currentWidget.classList.add('chosen');modal.close()}};document.querySelector('#planWidget').onclick=()=>{currentWidget.dataset.widget='';currentWidget.classList.remove('daily-quote');saveDailyQuoteSlots();currentWidget.textContent=window.studyPlan||'今日计划 · 点击日历设置';currentWidget.classList.add('chosen');modal.close()};document.querySelector('#dailyQuoteWidget').onclick=()=>{renderDailyQuote(currentWidget);saveDailyQuoteSlots();modal.close()};document.querySelector('#removeWidget').onclick=()=>{currentWidget.dataset.widget='';currentWidget.classList.remove('daily-quote');saveDailyQuoteSlots();currentWidget.innerHTML='<span class="plus">+</span>';currentWidget.classList.remove('chosen');setWidgetHidden(currentWidget,true);modal.close()}});restoreDailyQuotes();restoreHiddenWidgets();setInterval(()=>{document.querySelectorAll('.widget[data-widget="dailyQuote"]').forEach(widget=>{if(widget.dataset.quoteDate!==localDayKey())renderDailyQuote(widget)})},60000);
</script><script src="onboarding.js?v=3"></script><script src="entry.js?v=5"></script></body></html>
