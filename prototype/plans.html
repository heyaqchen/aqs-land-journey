<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>计划表 · AdvanCE!</title>
  <style>
    :root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#3478ed;background:#f4f7fc;--blue:#3478ed;--ink:#263b66;--muted:#7e899d;--line:#dbe4f2;--orange:#ff942e}
    *{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
    header{height:72px;background:#fff;border-bottom:1px solid var(--line)}nav{height:100%;width:min(900px,calc(100% - 36px));margin:auto;display:flex;align-items:center;justify-content:space-between}.left{display:flex;align-items:center;gap:13px}.back{border:0;background:transparent;font-size:27px;color:var(--ink);padding:4px 8px}.brand{font:italic 700 25px "Trebuchet MS",sans-serif;letter-spacing:-1px}.bang{color:var(--orange)}.today-chip{font-size:13px;color:var(--muted)}
    main{width:min(840px,calc(100% - 34px));margin:30px auto 60px}.heading{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:19px}.heading h1{font-size:26px;color:var(--ink);margin:0 0 6px}.heading p{font-size:14px;color:var(--muted);margin:0}.date-nav{display:flex;align-items:center;gap:12px}.date-nav button{border:1px solid var(--line);border-radius:9px;background:#fff;width:36px;height:36px;font-size:20px}.date-label{min-width:130px;text-align:center;color:#60728e;font-size:14px}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:17px}.tab{border:0;border-radius:8px;background:transparent;padding:11px 8px;color:#8391a6}.tab[aria-selected=true]{background:#edf4ff;color:var(--blue);font-weight:600}
    .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}.panel h2{margin:0 0 5px;font-size:19px;color:var(--ink)}.panel-intro{margin:0 0 17px;color:var(--muted);font-size:13px;line-height:1.7}.task-add{display:flex;gap:9px;margin-bottom:14px}.task-add input{flex:1;min-width:0;border:1px solid #cbd9f2;border-radius:9px;padding:11px 13px;background:#fff}.task-add button,.save-hint{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:10px 18px}.tasks{display:grid;gap:9px}.task{display:flex;align-items:center;gap:11px;border:1px solid #e5ebf4;border-radius:10px;padding:11px 12px}.task input{width:18px;height:18px;accent-color:var(--blue);flex:0 0 auto}.task-text{flex:1;line-height:1.6;overflow-wrap:anywhere;color:#4e6282}.task.done .task-text{text-decoration:line-through;color:#9aa5b4}.task-remove{border:0;background:transparent;color:#aab4c2;font-size:19px;padding:2px 7px}.empty{border:1px dashed #cbd6e5;border-radius:10px;text-align:center;color:#9aa5b4;padding:25px 14px;font-size:14px}.day-foot{display:flex;justify-content:space-between;color:#96a1b1;font-size:12px;margin-top:16px}
    .weeks{display:grid;gap:11px}.week-row{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:stretch;border:1px solid var(--line);border-radius:11px;padding:11px}.week-label{display:flex;align-items:center;justify-content:center;background:#eff5ff;border-radius:8px;color:var(--blue);font-weight:600}.week-row:nth-child(2) .week-label{background:#edf8f2;color:#6e9b7a}.week-row:nth-child(3) .week-label{background:#fff6e9;color:#bd9259}.week-row:nth-child(4) .week-label{background:#f5f0fb;color:#9077ac}.week-row textarea,.month-box textarea{width:100%;min-height:58px;resize:vertical;border:0;outline:0;background:transparent;color:#4e6282;line-height:1.7;padding:6px}.week-row textarea::placeholder,.month-box textarea::placeholder{color:#a4afbf}
    .month-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.month-box{border:1px solid var(--line);border-radius:12px;padding:15px}.month-box.todo{background:#f7faff}.month-box.review{background:#fbf9fd}.month-box h3{margin:0 0 10px;color:var(--ink);font-size:15px}.month-box textarea{min-height:180px;border:1px solid #e2e9f3;border-radius:9px;background:#fff;padding:11px}.month-box.review textarea{border-color:#e9e1f1}.save-hint{margin-top:17px;background:transparent;color:#98a4b5;padding:0;font-size:12px;cursor:default}[hidden]{display:none!important}
    @media(max-width:600px){main{margin:22px auto 45px}.heading{align-items:flex-start;gap:15px;flex-direction:column}.heading h1{font-size:23px}.date-nav{align-self:stretch;justify-content:space-between}.date-label{flex:1}.panel{padding:18px}.tab{font-size:14px;padding:10px 5px}.week-row{grid-template-columns:60px 1fr;padding:8px;gap:8px}.week-row textarea{min-height:65px}.month-grid{grid-template-columns:1fr}.month-box textarea{min-height:130px}.day-foot{gap:15px}}
  </style>
</head>
<body>
  <header><nav><div class="left"><button class="back" id="back" aria-label="返回首页">‹</button><span class="brand">AdvanCE<span class="bang">!</span></span></div><span class="today-chip">我的计划</span></nav></header>
  <main>
    <div class="heading"><div><h1>计划表</h1><p>把想做的事，一点点安排好。</p></div><div class="date-nav"><button id="previous" aria-label="上一个">‹</button><div class="date-label" id="dateLabel"></div><button id="next" aria-label="下一个">›</button></div></div>
    <div class="tabs" role="tablist" aria-label="计划类型"><button class="tab" role="tab" aria-selected="true" data-tab="day">日计划</button><button class="tab" role="tab" aria-selected="false" data-tab="week">周计划</button><button class="tab" role="tab" aria-selected="false" data-tab="month">月计划</button></div>
    <section class="panel" id="dayPanel" role="tabpanel"><h2>今日待办</h2><p class="panel-intro">写下今天想完成的事情，完成后点亮左侧圆点。</p><form class="task-add" id="addTaskForm"><input id="newTask" maxlength="120" placeholder="添加一项今天要做的事" aria-label="新的待办事项"><button type="submit">添加</button></form><div class="tasks" id="tasks"></div><div class="day-foot"><span id="taskProgress">还没有添加待办</span><span>自动保存到本机</span></div></section>
    <section class="panel" id="weekPanel" role="tabpanel" hidden><h2>本月周计划</h2><p class="panel-intro">将一个月拆成四段，给每周留下一件重点。</p><div class="weeks" id="weeks"></div><div class="day-foot"><span>第 1 周至第 4 周</span><span>自动保存到本机</span></div></section>
    <section class="panel" id="monthPanel" role="tabpanel" hidden><h2>月计划与复盘</h2><p class="panel-intro">既记下这个月准备做什么，也留一格回看走过的路。</p><div class="month-grid"><div class="month-box todo"><h3>本月待办</h3><form class="task-add" id="monthTaskForm"><input id="newMonthTask" maxlength="120" placeholder="添加本月待办" aria-label="新的本月待办"><button type="submit">添加</button></form><div class="tasks" id="monthTasks"></div><div class="day-foot"><span id="monthProgress">还没有添加待办</span></div></div><div class="month-box review"><h3>本月复盘</h3><textarea id="monthReview" maxlength="3000" placeholder="哪些事情完成了？有什么收获或想调整的地方？"></textarea></div></div><div class="day-foot"><span>计划与复盘互相照应</span><span>自动保存到本机</span></div></section>
  </main>
  <script>
    const localDate=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};let focusDate=new Date();focusDate.setHours(0,0,0,0);let activeTab='day';let dayTasks=[];const keyDay=()=>`advance-plan-day:${localDate(focusDate)}`,keyMonth=()=>`advance-plan-month:${localDate(focusDate).slice(0,7)}`,keyWeek=keyMonth;const safeRead=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||'null')??fallback}catch{return fallback}};const save=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
    function dateTitle(){document.querySelector('#dateLabel').textContent=activeTab==='day'?new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(focusDate):new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long'}).format(focusDate)}
    function renderTasks(){const root=document.querySelector('#tasks');root.innerHTML=dayTasks.length?dayTasks.map((task,i)=>'<div class="task '+(task.done?'done':'')+'"><input type="checkbox" aria-label="完成 '+escapeHtml(task.text)+'" data-done="'+i+'" '+(task.done?'checked':'')+'><span class="task-text">'+escapeHtml(task.text)+'</span><button class="task-remove" data-remove="'+i+'" aria-label="删除 '+escapeHtml(task.text)+'">×</button></div>').join(''):'<div class="empty">今天还没有待办，添加一项开始安排吧。</div>';root.querySelectorAll('[data-done]').forEach(box=>box.onchange=()=>{dayTasks[Number(box.dataset.done)].done=box.checked;save(keyDay(),dayTasks);renderTasks()});root.querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>{dayTasks.splice(Number(button.dataset.remove),1);save(keyDay(),dayTasks);renderTasks()});const finished=dayTasks.filter(x=>x.done).length;document.querySelector('#taskProgress').textContent=dayTasks.length?`已完成 ${finished} / ${dayTasks.length} 项`:'还没有添加待办'}
    function renderWeeks(){const data=safeRead(keyWeek(),['','','','']);document.querySelector('#weeks').innerHTML=data.map((text,i)=>'<div class="week-row"><div class="week-label">第 '+(i+1)+' 周</div><textarea data-week="'+i+'" maxlength="1000" placeholder="写下本周重点安排……">'+escapeHtml(text)+'</textarea></div>').join('');document.querySelectorAll('[data-week]').forEach(area=>area.oninput=()=>{const next=[...document.querySelectorAll('[data-week]')].map(x=>x.value);save(keyWeek(),next)})}
    function renderMonth(){const data=safeRead(keyMonth(),{todos:[],review:''});if(!Array.isArray(data.todos))data.todos=typeof data.todo==='string'&&data.todo.trim()?[{text:data.todo.trim(),done:false}]:[];document.querySelector('#monthReview').value=data.review||'';const root=document.querySelector('#monthTasks');root.innerHTML=data.todos.length?data.todos.map((task,i)=>'<div class="task '+(task.done?'done':'')+'"><input type="checkbox" aria-label="完成 '+escapeHtml(task.text)+'" data-month-done="'+i+'" '+(task.done?'checked':'')+'><span class="task-text">'+escapeHtml(task.text)+'</span><button class="task-remove" data-month-remove="'+i+'" aria-label="删除 '+escapeHtml(task.text)+'">×</button></div>').join(''):'<div class="empty">这个月还没有待办。</div>';root.querySelectorAll('[data-month-done]').forEach(box=>box.onchange=()=>{data.todos[Number(box.dataset.monthDone)].done=box.checked;save(keyMonth(),data);renderMonth()});root.querySelectorAll('[data-month-remove]').forEach(button=>button.onclick=()=>{data.todos.splice(Number(button.dataset.monthRemove),1);save(keyMonth(),data);renderMonth()});document.querySelector('#monthProgress').textContent=data.todos.length?'已完成 '+data.todos.filter(x=>x.done).length+' / '+data.todos.length+' 项':'还没有添加待办'}
    function loadDay(){dayTasks=safeRead(keyDay(),[]);if(!Array.isArray(dayTasks))dayTasks=[];renderTasks()}
    function switchTab(tab){activeTab=tab;document.querySelectorAll('.tab').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.tab===tab)));document.querySelector('#dayPanel').hidden=tab!=='day';document.querySelector('#weekPanel').hidden=tab!=='week';document.querySelector('#monthPanel').hidden=tab!=='month';dateTitle();if(tab==='day')loadDay();if(tab==='week')renderWeeks();if(tab==='month')renderMonth()}
    const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>switchTab(button.dataset.tab));document.querySelector('#addTaskForm').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#newTask'),text=input.value.trim();if(!text)return;dayTasks.push({text,done:false});save(keyDay(),dayTasks);input.value='';renderTasks();input.focus()};document.querySelector('#monthTaskForm').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#newMonthTask'),text=input.value.trim();if(!text)return;const data=safeRead(keyMonth(),{todos:[],review:''});if(!Array.isArray(data.todos))data.todos=[];data.todos.push({text,done:false});save(keyMonth(),data);input.value='';renderMonth();input.focus()};document.querySelector('#monthReview').oninput=()=>{const data=safeRead(keyMonth(),{todos:[],review:''});data.review=document.querySelector('#monthReview').value;save(keyMonth(),data)};
    function moveDate(delta){if(activeTab==='day')focusDate.setDate(focusDate.getDate()+delta);else focusDate.setMonth(focusDate.getMonth()+delta);dateTitle();if(activeTab==='day')loadDay();if(activeTab==='week')renderWeeks();if(activeTab==='month')renderMonth()}document.querySelector('#previous').onclick=()=>moveDate(-1);document.querySelector('#next').onclick=()=>moveDate(1);document.querySelector('#back').onclick=()=>location.href='index.html?view=home';dateTitle();loadDay();
  </script>
</body>
</html>
