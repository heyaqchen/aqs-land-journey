<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>今日总结 · AdvanCE!</title>
  <style>
    :root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#3478ed;background:#f5f7fb;--blue:#3478ed;--ink:#263b66;--muted:#7e899d;--line:#dbe4f2;--orange:#ff942e}
    *{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}header{height:72px;background:white;border-bottom:1px solid var(--line)}nav{height:100%;width:min(970px,calc(100% - 34px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font:italic 700 25px "Trebuchet MS",sans-serif;letter-spacing:-1px}.bang{color:var(--orange)}.back{border:0;background:transparent;font-size:26px;color:var(--ink);margin-right:12px;vertical-align:middle}main{width:min(970px,calc(100% - 34px));margin:29px auto 65px}.hero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 34px;text-align:center}.eyebrow{margin:0 0 8px;color:#8292ab;font-size:13px;letter-spacing:2px}.title{margin:0;color:var(--ink);font-size:25px}.user{display:flex;justify-content:center;align-items:center;gap:13px;margin:23px auto 19px}.avatar{width:58px;height:58px;border:2px solid #cbd9f2;border-radius:50%;display:grid;place-items:center;color:#92a1b8;font-size:26px}.user-name{font-size:16px;color:var(--ink);font-weight:600}.user-date{font-size:13px;color:var(--muted);margin-top:5px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);max-width:600px;margin:22px auto 4px}.metric{padding:9px 12px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric strong{display:block;color:var(--ink);font-size:25px;font-weight:600}.metric span{color:var(--muted);font-size:13px}.rule{height:1px;background:var(--line);margin:27px 0}.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:0 2px 14px}.section-head h2{font-size:19px;color:var(--ink);margin:0}.section-head p{font-size:13px;color:var(--muted);margin:0}.templates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.template{--soft:#f0f5ff;--tone:#6f91d1;background:white;border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .15s}.template:hover{transform:translateY(-2px);box-shadow:0 6px 18px #273f6714;border-color:var(--tone)}.template.kpt{--soft:#eff8f2;--tone:#70a681}.template.ywt{--soft:#eff6fb;--tone:#6c9fba}.template.pdca{--soft:#fff6e9;--tone:#d3a05c}.template.fdld{--soft:#f6f1fb;--tone:#9d85ba}.template-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.template h3{margin:0;color:var(--ink);font-size:16px}.expand{color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{min-height:65px;border-radius:9px;background:var(--soft);padding:9px}.field label{display:block;color:var(--tone);font-size:12px;font-weight:600;margin-bottom:4px}.field textarea{width:100%;height:30px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font-size:12px;line-height:1.55;padding:0}.field textarea::placeholder{color:#a5afbf}.reflections{margin-top:21px}.analysis{background:#fff;border:1px solid var(--line);border-radius:15px;padding:21px 23px}.analysis h2{font-size:18px;color:var(--ink);margin:0 0 10px}.analysis p{color:#61738e;line-height:1.9;margin:0}.analysis strong{color:var(--blue)}.shared{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:#8290a4}.end-actions{display:flex;justify-content:center;gap:11px;margin:22px auto 0}.end-actions button{border:1px solid #cbd9f2;background:white;border-radius:10px;padding:10px 18px}.end-actions .primary{background:var(--blue);color:white;border-color:var(--blue)}.modal{width:min(700px,calc(100vw - 28px));max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:18px;padding:23px;background:white;color:var(--ink)}.modal::backdrop{background:#1e315544}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{margin:0;font-size:21px}.close{width:35px;height:35px;border:0;border-radius:50%;background:#f2f5fa;color:#75839b;font-size:23px}.modal .fields{gap:12px}.modal .field{min-height:125px;padding:12px}.modal .field label{font-size:14px}.modal .field textarea{height:80px;font-size:14px}.save-row{text-align:right;margin-top:16px}.save-row button{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:10px 20px}.footnote{text-align:center;font-size:12px;color:#9aa5b5;margin:18px 0 0}
    @media(max-width:600px){main{margin-top:16px}.hero{padding:23px 17px}.metrics{margin-left:-6px;margin-right:-6px}.metric{padding:8px 5px}.metric strong{font-size:21px}.templates{gap:10px}.template{padding:11px}.fields{gap:6px}.field{min-height:67px;padding:7px}.field textarea{height:33px;font-size:11px}.section-head{align-items:flex-start;gap:8px;flex-direction:column}.section-head p{font-size:12px}.analysis{padding:17px}.modal .fields{grid-template-columns:1fr}.modal .field textarea{height:62px}}
  </style>
</head>
<body>
  <header><nav><div><button class="back" id="back" aria-label="返回首页">‹</button><span class="brand">AdvanCE<span class="bang">!</span></span></div><span style="font-size:14px;color:#7e899d">每日总结</span></nav></header>
  <main>
    <section class="hero" aria-label="今日学习回顾"><p class="eyebrow">YOUR DAILY RECAP</p><h1 class="title">今天的努力，值得被看见。</h1><div class="user"><div class="avatar" aria-hidden="true">♙</div><div style="text-align:left"><div class="user-name" id="userName">同学</div><div class="user-date" id="dateText"></div></div></div><div class="metrics"><div class="metric"><strong id="answered">0</strong><span>完成题目</span></div><div class="metric"><strong id="accuracy">—</strong><span>正确率</span></div><div class="metric"><strong id="notesCount">0</strong><span>反思笔记</span></div></div></section>
    <div class="rule"></div>
    <section aria-labelledby="reflectionTitle"><div class="section-head"><h2 id="reflectionTitle">选择一个反思模板</h2><p>点击卡片放大填写，内容会自动保存</p></div><div class="templates" id="templates"></div></section>
    <section class="reflections" aria-labelledby="analysisTitle"><div class="rule"></div><div class="analysis"><h2 id="analysisTitle">写给今天的你</h2><p id="analysisText"></p><div class="shared" id="sharedNotes"></div></div><div class="end-actions"><button id="homeButton">返回首页</button><button class="primary" id="finishButton">完成今日总结</button></div><p class="footnote">你的学习记录和反思内容保存在当前设备中。</p></section>
  </main>
  <dialog class="modal" id="templateDialog"><div class="modal-head"><h2 id="dialogTitle"></h2><button class="close" id="closeDialog" aria-label="关闭">×</button></div><div id="dialogFields"></div><div class="save-row"><button id="saveTemplate">保存反思</button></div></dialog>
  <script>
    const dayKey=new Date().toISOString().slice(0,10),sessionKey='advance-study-'+dayKey;let session={answers:{},submitted:[],notes:{},noteShared:{}};try{session=Object.assign(session,JSON.parse(localStorage.getItem(sessionKey)||'{}'))}catch{};let reflections={};try{reflections=JSON.parse(localStorage.getItem('advance-reflections-'+dayKey)||'{}')}catch{}
    const templates=[{id:'kpt',name:'KPT',fields:[['keep','Keep · 保持','今天值得继续的事'],['problem','Problem · 问题','遇到的阻碍或困惑'],['try','Try · 尝试','下次想试试什么']]},{id:'ywt',name:'YWT',fields:[['y','Y · 做到的事','今天完成了什么'],['w','W · 理解的事','今天理解了什么'],['t','T · 接下来要做的事','下一步准备做什么']]},{id:'pdca',name:'PDCA',fields:[['plan','Plan · 计划','原本的学习计划'],['do','Do · 执行','实际做了什么'],['check','Check · 检查','结果如何，差在哪里'],['action','Action · 行动','接下来怎么调整']]},{id:'fdld',name:'FDLD',fields:[['fact','Fact · 事实','今天发生了什么'],['discover','Discover · 发现','有什么新的发现'],['lesson','Lesson · 教训','从中学到了什么'],['determination','Determination · 决心','接下来给自己的承诺']]}];
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function saveReflections(){try{localStorage.setItem('advance-reflections-'+dayKey,JSON.stringify(reflections))}catch{}renderCards();renderAnalysis()}
    function fieldMarkup(t,f,large=false){const value=(reflections[t.id]||{})[f[0]]||'';return '<div class="field"><label for="'+(large?'large-':'small-')+t.id+'-'+f[0]+'">'+esc(f[1])+'</label><textarea '+(large?'id="large-':'id="small-')+t.id+'-'+f[0]+'" data-template="'+t.id+'" data-field="'+f[0]+'" maxlength="500" placeholder="'+esc(f[2])+'">'+esc(value)+'</textarea></div>'}
    function renderCards(){document.querySelector('#templates').innerHTML=templates.map(t=>'<article class="template '+t.id+'" tabindex="0" role="button" aria-label="打开 '+t.name+' 反思模板" data-open-template="'+t.id+'"><div class="template-top"><h3>'+t.name+'</h3><span class="expand">点击展开 ↗</span></div><div class="fields">'+t.fields.map(f=>fieldMarkup(t,f)).join('')+'</div></article>').join('');document.querySelectorAll('[data-open-template]').forEach(card=>{card.onclick=()=>openTemplate(card.dataset.openTemplate);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openTemplate(card.dataset.openTemplate)}}});document.querySelectorAll('#templates textarea').forEach(textarea=>textarea.oninput=()=>updateReflection(textarea))}
    function updateReflection(el){reflections[el.dataset.template]??={};reflections[el.dataset.template][el.dataset.field]=el.value;try{localStorage.setItem('advance-reflections-'+dayKey,JSON.stringify(reflections))}catch{}renderAnalysis()}
    const dialog=document.querySelector('#templateDialog');function openTemplate(id){const t=templates.find(x=>x.id===id);if(!t)return;document.querySelector('#dialogTitle').textContent=t.name+' 反思';document.querySelector('#dialogFields').innerHTML='<div class="fields">'+t.fields.map(f=>fieldMarkup(t,f,true)).join('')+'</div>';document.querySelectorAll('#dialogFields textarea').forEach(el=>el.oninput=()=>{updateReflection(el);const small=document.querySelector('#small-'+el.dataset.template+'-'+el.dataset.field);if(small)small.value=el.value});dialog.dataset.template=id;dialog.showModal()}
    document.querySelector('#closeDialog').onclick=()=>dialog.close();document.querySelector('#saveTemplate').onclick=()=>{dialog.close();renderCards()};document.querySelector('#back').onclick=()=>location.href='index.html?view=home';document.querySelector('#homeButton').onclick=()=>location.href='index.html?view=home';document.querySelector('#finishButton').onclick=()=>location.href='index.html?view=home';
    function renderAnalysis(){const submitted=(session.submitted||[]).map(Boolean);const answerKey=[3,1,3];const answeredIndices=submitted.map((done,i)=>done?i:-1).filter(i=>i>=0&&(session.answers||{})[i]!==undefined&&(session.answers||{})[i]!==null);const correct=answeredIndices.filter(i=>session.answers[i]===answerKey[i]).length;const count=answeredIndices.length,rate=count?Math.round(correct/count*100):null;const totalSubmitted=submitted.filter(Boolean).length;document.querySelector('#answered').textContent=totalSubmitted;document.querySelector('#accuracy').textContent=rate===null?'—':rate+'%';const reflectionCount=Object.values(reflections).reduce((sum,obj)=>sum+Object.values(obj||{}).filter(v=>String(v).trim()).length,0);document.querySelector('#notesCount').textContent=reflectionCount;const chosenMode=localStorage.getItem('advance-setting-defaultMode')||'平时练习';let intro;if(!count)intro='今天还没有已提交的练习记录。你仍然可以选一个反思模板，记下此刻的想法；这份总结只基于当前保存的内容。';else if(rate>=80)intro='今天完成了 <strong>'+totalSubmitted+' 道题</strong>，正确率 <strong>'+rate+'%</strong>。稳定的表现说明你已经抓住了不少关键点；把让你犹豫的地方写下来，会让这些进步更牢靠。';else if(rate>=50)intro='今天完成了 <strong>'+totalSubmitted+' 道题</strong>，正确率 <strong>'+rate+'%</strong>。你已经通过练习找到了值得再看一眼的知识点；错题不是退步，而是下一次练习最清楚的路标。';else intro='今天完成了 <strong>'+totalSubmitted+' 道题</strong>，正确率 <strong>'+rate+'%</strong>。这组题可能比预期更有挑战，但你愿意面对它们，就已经开始积累经验。明天可以挑一个最困惑的点，慢一点重新梳理。';const reflectionEntries=Object.entries(reflections).flatMap(([template,obj])=>Object.entries(obj||{}).filter(([,value])=>String(value).trim()).map(([field,value])=>({template,field,value:String(value).trim()})));let personal='';if(reflectionEntries.length){const first=reflectionEntries[0];const excerpt=first.value.length>46?first.value.slice(0,46)+'…':first.value;const terms=['困难','错','不会','忘','卡','焦虑','累','难'];const signal=terms.find(term=>reflectionEntries.some(entry=>entry.value.includes(term)));personal=signal?' 你在笔记里写下“'+esc(excerpt)+'”，也提到了“'+signal+'”。先把注意力放在一个具体的小问题上，已经足够开启下一步。':' 你在笔记里写下“'+esc(excerpt)+'”。这个观察来自你自己的学习过程，明天可以沿着它继续试一小步。'}document.querySelector('#analysisText').innerHTML=intro+personal+' 今天选择的学习模式是 <strong>'+esc(chosenMode)+'</strong>，明天也可以按自己的节奏继续。';const shared=[];Object.keys(session.noteShared||{}).forEach(index=>{if(session.noteShared[index]&&session.notes?.[index]?.trim())shared.push(session.notes[index].trim())});document.querySelector('#sharedNotes').textContent=shared.length?'你同意展示的答题笔记：'+shared.map(x=>'“'+x+'”').join(' · '):'答题区尚无已同意展示的笔记。'}
    let profile={};try{profile=JSON.parse(localStorage.getItem('advance-demo-profile')||'{}')}catch{}document.querySelector('#userName').textContent=profile.name||localStorage.getItem('advance-demo-name')||'同学';if(profile.avatar)document.querySelector('.avatar').textContent=profile.avatar;document.querySelector('#dateText').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());renderCards();renderAnalysis();
  </script>
</body>
</html>
