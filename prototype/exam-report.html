<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模拟考试报告 · AdvanCE!</title><link rel="stylesheet" href="exam.css"><style>
.report-head{text-align:center}.eyebrow{font-size:12px;letter-spacing:2px;color:#8b98ae;margin:0 0 7px}.report-head h1{font-size:27px;color:var(--ink);margin:0 0 5px}.report-head p{color:var(--muted);font-size:14px;margin:0}.score-card{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:22px}.score-box{border:1px solid var(--line);border-radius:14px;background:#fff;padding:21px;text-align:center}.score-box strong{display:block;color:var(--ink);font-size:30px;margin-bottom:4px}.score-box span{font-size:13px;color:var(--muted)}.report-section{border:1px solid var(--line);background:#fff;border-radius:15px;padding:23px;margin-top:18px}.report-section h2{font-size:18px;color:var(--ink);margin:0 0 17px}.time-rows{display:grid;gap:12px}.time-row{display:grid;grid-template-columns:78px 1fr 55px;gap:12px;align-items:center;font-size:14px;color:#5f7290}.bar{height:9px;border-radius:20px;background:#eaf0fa;overflow:hidden}.bar span{display:block;height:100%;border-radius:20px;background:#85a9ed}.question-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.question-result{text-align:center}.question-circle{width:72px;height:72px;border-radius:50%;margin:0 auto 9px;display:grid;place-items:center;border:1px solid transparent;font-size:20px;font-weight:600}.question-circle.full{background:#e6f4ea;color:#4d8562;border-color:#b4d9bd}.question-circle.partial{background:#fff5dc;color:#a38038;border-color:#eedba1}.question-circle.zero{background:#fbe8e8;color:#b97070;border-color:#edc5c5}.question-result p{font-size:13px;color:#61738e;margin:0}.question-result small{display:block;margin-top:4px;color:#94a1b4}.legend{display:flex;gap:17px;flex-wrap:wrap;margin-top:16px;color:#8291a7;font-size:12px}.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.analysis-item{border-radius:10px;background:#f6f9ff;padding:16px;line-height:1.8;color:#596e8f;font-size:14px}.analysis-item h3{font-size:14px;color:var(--ink);margin:0 0 6px}.encourage{border-top:1px dashed var(--line);padding-top:15px;margin:17px 0 0;line-height:1.8;color:#5d718f}.actions{display:flex;justify-content:center;gap:11px;margin:22px auto}.actions a{text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 17px;background:#fff;color:var(--blue)}.actions .primary{background:var(--blue);color:white;border-color:var(--blue)}.empty{color:#6a7d97;line-height:1.8;text-align:center}
@media(max-width:600px){.report-section{padding:18px}.question-grid{grid-template-columns:repeat(2,1fr)}.analysis-grid{grid-template-columns:1fr}.score-box strong{font-size:24px}.time-row{grid-template-columns:66px 1fr 45px;gap:8px;font-size:12px}}
</style></head><body><header><nav class="topbar"><div class="brand-wrap"><a class="back" href="index.html?view=home" aria-label="返回首页" style="text-decoration:none">‹</a><span class="logo">AdvanCE<span class="bang">!</span></span></div><span style="font-size:14px;color:#7e8da5">模拟考试报告</span></nav></header><main><div class="report-head"><p class="eyebrow">EXAM REVIEW</p><h1>模拟考试报告</h1><p>回看每一道题，也看见自己的进步。</p></div><div id="reportContent"></div></main><script src="exam-report.js"></script></body></html>
