<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 · AdvanCE!</title>
  <style>
    :root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#3478ed;background:#f4f7fc;--blue:#3478ed;--ink:#263b66;--muted:#7e899d;--border:#dbe4f2;--orange:#ff942e}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
    header{height:76px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 max(22px,calc((100% - 920px)/2));gap:20px}
    .back{width:40px;height:40px;border:0;background:transparent;border-radius:50%;font-size:26px;color:var(--ink)}.brand{font:italic 700 27px/1.2 "Trebuchet MS",sans-serif;letter-spacing:-1.3px;color:var(--blue)}.bang{color:var(--orange)}
    main{width:min(920px,calc(100% - 36px));margin:36px auto 70px}.heading{margin-bottom:25px}.heading h1{font-size:27px;color:var(--ink);margin:0 0 7px}.heading p{margin:0;color:var(--muted);font-size:14px}
    .layout{display:grid;grid-template-columns:215px 1fr;gap:24px}.nav,.group{background:#fff;border:1px solid var(--border);border-radius:16px}.nav{padding:13px;height:max-content;position:sticky;top:20px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:12px 13px;color:#65748d}.nav button.active,.nav button:hover{background:#edf4ff;color:var(--blue)}
    .content{display:grid;gap:18px}.group{overflow:hidden}.group h2{font-size:16px;color:var(--ink);margin:0;padding:18px 21px 10px}.row{display:flex;align-items:center;gap:15px;padding:16px 21px;border-top:1px solid #edf1f7;min-height:69px}.row:first-of-type{border-top:0}.row-main{flex:1;min-width:0}.label{font-size:15px;color:var(--ink)}.desc{font-size:13px;color:var(--muted);margin-top:5px}.chevron{color:#aab4c4;font-size:23px}.profile{display:flex;align-items:center;gap:14px}.avatar{width:48px;height:48px;display:grid;place-items:center;border:2px solid #c9d7ed;border-radius:50%;color:#8495b2;font-size:20px}.edit{border:1px solid #c9d9f3;border-radius:9px;background:#fff;padding:8px 14px;font-size:14px}.select{border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 12px;min-width:130px}.switch{width:46px;height:26px;border:0;border-radius:99px;background:#c8d0dc;padding:3px;transition:.16s}.switch:after{content:"";display:block;width:20px;height:20px;border-radius:50%;background:white;transition:.16s}.switch[aria-checked=true]{background:var(--blue)}.switch[aria-checked=true]:after{transform:translateX(20px)}.account{color:#cc5962}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:#263b66;color:#fff;padding:11px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    dialog{width:min(420px,calc(100% - 30px));border:1px solid var(--border);border-radius:17px;padding:24px;color:var(--ink)}dialog::backdrop{background:#1d315244}dialog h2{margin:0 0 17px;font-size:19px}dialog label{display:block;margin:13px 0 6px;color:#6e7e98;font-size:14px}dialog input{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.dialog-actions button{padding:9px 17px;border:1px solid var(--border);background:white;border-radius:9px}.dialog-actions .primary{background:var(--blue);color:white;border-color:var(--blue)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.close{width:35px;height:35px;border:0;border-radius:50%;background:#f2f5fa;color:#75839b;font-size:23px;padding:0}.baseline-dialog .dialog-actions{position:sticky;bottom:-24px;background:white;padding:12px 0 0}.baseline-dialog .desc{font-size:13px;margin-top:8px}.baseline-dialog [hidden]{display:none!important}dialog.baseline-dialog{width:min(760px,calc(100% - 28px));max-height:88vh;overflow:auto}.baseline-intro{margin:-5px 0 17px;color:var(--muted);font-size:14px;line-height:1.7}.baseline-level{border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:12px}.baseline-level h3{margin:0 0 10px;color:var(--ink);font-size:15px}.baseline-q{border-top:1px solid #edf1f7;padding:12px 0 4px}.baseline-q:first-of-type{border-top:0}.baseline-q p{margin:0 0 8px;font-size:14px;line-height:1.6;color:#405777}.baseline-options{display:flex;gap:9px;flex-wrap:wrap}.baseline-options label{display:flex;align-items:center;gap:5px;margin:0;padding:6px 9px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px}.baseline-options input{width:auto;padding:0;accent-color:var(--blue)}.baseline-result{background:#f3f7ff;padding:15px;border-radius:11px;line-height:1.8;color:#566985}.baseline-result strong{color:var(--blue)}
    @media(max-width:650px){header{height:64px}.layout{grid-template-columns:1fr;gap:14px}main{margin-top:25px}.nav{position:static;display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto;padding:10px 12px}.heading h1{font-size:24px}.row{padding:14px 16px}.group h2{padding-left:16px}}
  </style>
</head>
<body>
  <header><button class="back" id="back" aria-label="返回">‹</button><div class="brand">AdvanCE<span class="bang">!</span></div></header>
  <main>
    <div class="heading"><h1>应用设置</h1><p>管理你的账号与学习体验</p></div>
    <div class="layout">
      <nav class="nav" aria-label="设置分类"><button class="active" data-target="account">账号与安全</button><button data-target="learning-notifications">学习&通知</button><button data-target="about">关于应用</button></nav>
      <div class="content">
        <section class="group" id="account"><h2>账号与安全</h2><div class="row"><div class="row-main"><div class="label">当前账号</div><div class="desc" id="accountName">已登录</div></div><span class="desc">本机原型账号</span></div><div class="row"><div class="row-main"><div class="label">登录密码</div><div class="desc">定期更新密码，保护账号安全</div></div><button class="edit" data-security="password">重设密码</button></div><div class="row"><div class="row-main"><div class="label">邮箱</div><div class="desc" id="emailStatus">尚未绑定邮箱</div></div><button class="edit" data-security="email">绑定邮箱</button></div><div class="row"><div class="row-main"><div class="label">手机号</div><div class="desc" id="phoneStatus">尚未绑定手机号</div></div><button class="edit" data-security="phone">绑定手机</button></div></section>
        <section class="group" id="learning-notifications"><h2>学习&通知</h2><div class="row"><div class="row-main"><div class="label">做题状态基线</div><div class="desc">通过不同难度的短测，了解你平时的答题状态</div></div><button class="edit" id="baselineStart">开始测量</button></div><div class="row"><div class="row-main"><div class="label">每日问候</div><div class="desc">每天送上一句问候语或鼓励语</div></div><button class="switch" role="switch" aria-checked="false" data-setting="greeting" aria-label="每日问候"></button></div><div class="row" id="baselineSummaryRow" hidden><div class="row-main"><div class="label">最近一次基线</div><div class="desc" id="baselineSummary">尚未完成测量</div></div><button class="edit" id="baselineReview">查看结果</button></div></section>
        <section class="group" id="about"><h2>关于应用</h2><div class="row"><div class="row-main"><div class="label">版本</div></div><span class="desc">原型预览版 1.0</span></div><div class="row"><div class="row-main"><div class="label">隐私与服务</div></div><span class="chevron">›</span></div><div class="row"><button class="account" id="logout" style="border:0;background:transparent;padding:0">退出当前账号</button></div></section>
      </div>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="securityDialog"><h2 id="securityTitle">账号安全</h2><div id="securityFields"></div><div class="dialog-actions"><button id="cancelSecurity">取消</button><button class="primary" id="saveSecurity">确认</button></div></dialog>
  <dialog class="baseline-dialog" id="baselineDialog"><div class="modal-head"><h2 id="baselineTitle">做题状态基线测量</h2><button class="close" id="closeBaseline" aria-label="关闭">×</button></div><p class="baseline-intro" id="baselineIntro">共 9 道题，分为基础、进阶、挑战三个难度，每档 3 题。按平时节奏作答即可。</p><div id="baselineContent"></div><div class="dialog-actions"><button id="cancelBaseline">稍后再做</button><button class="primary" id="submitBaseline">提交测量</button></div></dialog>
  <script>
    const goHome=()=>location.href='index.html?view=home';document.querySelector('#back').onclick=goHome;

    const stored=JSON.parse(localStorage.getItem('advance-demo-profile')||'{}');document.querySelector('#accountName').textContent=stored.name||localStorage.getItem('advance-demo-name')||'已登录';

    const toastEl=document.querySelector('#toast');let toastTimer;function toast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1900)}
    const securityDialog=document.querySelector('#securityDialog'),securityFields=document.querySelector('#securityFields');function updateBoundRows(){const email=localStorage.getItem('advance-bound-email'),phone=localStorage.getItem('advance-bound-phone');document.querySelector('#emailStatus').textContent=email||'尚未绑定邮箱';document.querySelector('#phoneStatus').textContent=phone||'尚未绑定手机号';document.querySelectorAll('[data-security="email"]')[0].textContent=email?'更换邮箱':'绑定邮箱';document.querySelectorAll('[data-security="phone"]')[0].textContent=phone?'更换手机':'绑定手机'}
    document.querySelectorAll('[data-security]').forEach(button=>button.onclick=()=>{const kind=button.dataset.security;securityDialog.dataset.kind=kind;if(kind==='password'){document.querySelector('#securityTitle').textContent='重设密码';securityFields.innerHTML='<label for="newPassword">新密码</label><input id="newPassword" type="password" minlength="6" autocomplete="new-password" placeholder="至少 6 位"><label for="confirmPassword">确认新密码</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="再次输入新密码"><p class="desc">此为原型演示，不会保存真实密码。</p>'}else{const email=kind==='email',key=email?'advance-bound-email':'advance-bound-phone',current=localStorage.getItem(key)||'';document.querySelector('#securityTitle').textContent=email?(current?'更换绑定邮箱':'绑定邮箱'):(current?'更换绑定手机号':'绑定手机号');securityFields.innerHTML='<label for="bindValue">'+(email?'邮箱地址':'手机号码')+'</label><input id="bindValue" type="'+(email?'email':'tel')+'" autocomplete="'+(email?'email':'tel')+'" value="'+current+'" placeholder="'+(email?'name@example.com':'请输入 11 位手机号')+'"><p class="desc">当前为本地原型，暂不发送验证码。</p>'}securityDialog.showModal()});
    document.querySelector('#cancelSecurity').onclick=()=>securityDialog.close();document.querySelector('#saveSecurity').onclick=()=>{const kind=securityDialog.dataset.kind;if(kind==='password'){const a=document.querySelector('#newPassword').value,b=document.querySelector('#confirmPassword').value;if(a.length<6){document.querySelector('#newPassword').focus();return}if(a!==b){document.querySelector('#confirmPassword').setCustomValidity('两次输入的密码不一致');document.querySelector('#confirmPassword').reportValidity();document.querySelector('#confirmPassword').setCustomValidity('');return}toast('密码重设完成（原型演示）')}else{const value=document.querySelector('#bindValue').value.trim(),email=kind==='email';if(email?!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value):!/^1\d{10}$/.test(value)){const input=document.querySelector('#bindValue');input.setCustomValidity(email?'请输入有效的邮箱地址':'请输入有效的 11 位手机号');input.reportValidity();input.focus();input.oninput=()=>input.setCustomValidity('');return}localStorage.setItem(email?'advance-bound-email':'advance-bound-phone',value);updateBoundRows();toast(email?'邮箱已绑定':'手机号已绑定')}securityDialog.close()};updateBoundRows();    document.querySelectorAll('[data-setting]').forEach(button=>{const key='advance-setting-'+button.dataset.setting;const saved=localStorage.getItem(key);if(saved!==null)button.setAttribute('aria-checked',saved);button.onclick=()=>{const next=button.getAttribute('aria-checked')!=='true';button.setAttribute('aria-checked',String(next));localStorage.setItem(key,String(next));toast(next?'已开启':'已关闭')}});
    const baselineQuestions=[{level:'基础',q:'She ___ a student.',options:['am','is','are'],answer:1},{level:'基础',q:'I ___ breakfast every morning.',options:['have','has','having'],answer:0},{level:'基础',q:'They ___ football yesterday.',options:['play','plays','played'],answer:2},{level:'进阶',q:'If I were you, I ___ a short break.',options:['will take','would take','took'],answer:1},{level:'进阶',q:'She has lived here ___ 2020.',options:['for','since','during'],answer:1},{level:'进阶',q:'This is the book ___ I told you about.',options:['who','that','where'],answer:1},{level:'挑战',q:'Neither the students nor their teacher ___ ready.',options:['were','are','was'],answer:2},{level:'挑战',q:'Had I known earlier, I ___ you.',options:['would tell','would have told','will tell'],answer:1},{level:'挑战',q:'The proposal, together with its revisions, ___ approved.',options:['were','was','have been'],answer:1}];const baselineDialog=document.querySelector('#baselineDialog'),baselineContent=document.querySelector('#baselineContent');let baselineStarted=0;function readBaseline(){try{return JSON.parse(localStorage.getItem('advance-baseline-result')||'null')}catch{return null}}function updateBaselineRow(){const result=readBaseline(),row=document.querySelector('#baselineSummaryRow');row.hidden=!result;if(result){const d=new Date(result.date+'T00:00:00');document.querySelector('#baselineSummary').textContent=d.toLocaleDateString('zh-CN')+' · 基础 '+result.scores[0]+'/3，进阶 '+result.scores[1]+'/3，挑战 '+result.scores[2]+'/3 · 用时 '+result.seconds+' 秒';document.querySelector('#baselineStart').textContent='重新测量'}}function openBaselineResult(){const result=readBaseline();if(!result)return;document.querySelector('#baselineTitle').textContent='最近一次基线结果';document.querySelector('#baselineIntro').textContent='本机保存的最近一次测量结果';baselineContent.innerHTML='<div class="baseline-result">基础：<strong>'+result.scores[0]+'/3</strong><br>进阶：<strong>'+result.scores[1]+'/3</strong><br>挑战：<strong>'+result.scores[2]+'/3</strong><br>完成用时：<strong>'+result.seconds+' 秒</strong><p class="desc">这是一组学习状态参考题，结果仅用于自我对照，不代表能力评价。</p></div>';document.querySelector('#submitBaseline').hidden=true;document.querySelector('#cancelBaseline').textContent='关闭';baselineDialog.showModal()}function startBaseline(){document.querySelector('#baselineTitle').textContent='做题状态基线测量';document.querySelector('#baselineIntro').textContent='共 9 道题，分为基础、进阶、挑战三个难度，每档 3 题。按平时节奏作答即可。';document.querySelector('#submitBaseline').hidden=false;document.querySelector('#cancelBaseline').textContent='稍后再做';baselineContent.innerHTML=['基础','进阶','挑战'].map(level=>'<section class="baseline-level"><h3>'+level+' · 3 道题</h3>'+baselineQuestions.map((item,index)=>item.level===level?'<div class="baseline-q"><p>'+((baselineQuestions.indexOf(item)%3)+1)+'. '+item.q+'</p><div class="baseline-options">'+item.options.map((option,i)=>'<label><input type="radio" name="baseline-'+index+'" value="'+i+'">'+option+'</label>').join('')+'</div></div>':'').join('')+'</section>').join('');baselineStarted=performance.now();baselineDialog.showModal()}document.querySelector('#baselineStart').onclick=startBaseline;document.querySelector('#baselineReview').onclick=openBaselineResult;document.querySelector('#closeBaseline').onclick=()=>baselineDialog.close();document.querySelector('#cancelBaseline').onclick=()=>baselineDialog.close();document.querySelector('#submitBaseline').onclick=()=>{const missing=baselineQuestions.findIndex((_,i)=>!document.querySelector('[name="baseline-'+i+'"]:checked'));if(missing>=0){document.querySelector('[name="baseline-'+missing+'"]').focus();toast('请先完成 9 道测量题');return}const scores=[0,0,0];baselineQuestions.forEach((item,i)=>{if(Number(document.querySelector('[name="baseline-'+i+'"]:checked').value)===item.answer)scores[['基础','进阶','挑战'].indexOf(item.level)]++});const result={date:new Date().toISOString().slice(0,10),scores,seconds:Math.max(1,Math.round((performance.now()-baselineStarted)/1000))};localStorage.setItem('advance-baseline-result',JSON.stringify(result));updateBaselineRow();baselineDialog.close();toast('做题状态基线已保存')};updateBaselineRow();
    document.querySelectorAll('.nav button').forEach(button=>button.onclick=()=>{document.querySelectorAll('.nav button').forEach(item=>item.classList.toggle('active',item===button));document.getElementById(button.dataset.target).scrollIntoView({behavior:'smooth',block:'start'})});
    document.querySelector('#logout').onclick=()=>toast('原型预览中暂不支持退出登录');
  </script>
</body>
</html>
