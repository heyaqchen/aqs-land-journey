:10;cursor:grab;font-size:15px;user-select:none}.bubble:active{cursor:grabbing}.bubble-panel{position:fixed;right:30px;bottom:124px;width:260px;padding:22px;background:#fff;border:1.5px solid #3478ed;border-radius:15px;z-index:11;font-size:14px;line-height:1.8}.bubble-panel h2{font-size:17px;margin:0 0 12px}.bubble-panel p{color:#77859a}.bubble-panel button{padding:6px 14px;float:right}[hidden]{display:none!important}@media(max-width:600px){nav{padding:17px 19px}.logo{font-size:23px}.brand{gap:10px}select{max-width:138px;padding:9px;font-size:13px}main{margin-top:23px;padding:0 16px 100px}.card{padding:23px 19px}.stem{font-size:17px}.option{padding:12px;gap:10px;font-size:14px}.details{padding:0}.panel{padding:22px 20px}.tabs{padding:0 20px;gap:25px}.bubble{right:17px;bottom:20px;width:59px;height:59px}.crumbs{font-size:13px;gap:9px}.answer{gap:13px}.bubble-panel{right:17px;bottom:90px}}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:0}.tab{width:100%;text-align:center}.tab+.tab{border-left:1px dashed #bac2ce}.tab[aria-selected=true]:after{left:30%;right:30%}.stem{user-select:text;-webkit-user-select:text}.stem.mark-ready{outline:1px dashed #b4c4dd;outline-offset:7px}.stem mark{background:#fff0b5;color:inherit;text-decoration:underline;text-decoration-color:#bb9e43;text-underline-offset:4px}.option{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}.option.excluded{background:#f4f5f7;border-color:#dce0e6;color:#9aA3b0}.option.excluded .letter,.option.excluded .option-text{text-decoration:line-through;text-decoration-thickness:1.5px}.gesture-hint{font-size:12px;color:#8795a9;line-height:1.8;margin:0 0 18px}.mark-tool{position:fixed;z-index:20;bottom:22px;left:50%;transform:translateX(-50%);background:#3478ed;color:white;border:0;white-space:nowrap}.mark-tool:hover{background:#354f80}

</style></head><body><header><nav aria-label="顶部导航"><div class="brand"><button class="back" aria-label="返回首页" onclick="location.href='index.html?view=home'"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></svg></button><span class="logo">AdvanCE<span class="brand-bang">!</span></span></div><select id="questionSelect" aria-label="选择题目"><option value="0">第 01 题</option><option value="1">第 02 题</option><option value="2">第 03 题</option></select></nav></header><main><div class="crumbs" aria-label="面包屑"><a href="index.html?view=home">首页</a><span>/</span><strong>平时练习</strong><span>/</span><span>英语 · 基础语法</span></div><section class="card" aria-label="试题"><div class="question-head"><span class="badge">单选题</span><span class="count"><b id="number">01</b> / 03</span></div><h1 class="stem" id="stem"></h1><fieldset class="options" id="options" aria-label="选择答案"></fieldset><div class="pager"><button id="prev">上一题</button><button class="primary" id="submitAnswer">提交答案</button><button id="next">下一题</button></div></section><section class="details card" aria-label="答题详情"><div class="tabs" role="tablist" aria-label="题目详情"><button class="tab" role="tab" id="tab-analysis" aria-selected="true" aria-controls="panel" data-tab="analysis">解析</button><button class="tab" role="tab" id="tab-notes" aria-selected="false" aria-controls="panel" data-tab="notes" tabindex="-1">笔记</button><button class="tab" role="tab" id="tab-discussion" aria-selected="false" aria-controls="panel" data-tab="discussion" tabindex="-1">讨论</button></div><div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-analysis" aria-live="polite"></div></section></main><button class="bubble" id="bubble" aria-label="泡泡，可拖拽或使用方向键移动" aria-expanded="false">泡泡</button><aside class="bubble-panel" id="bubblePanel" hidden><h2>泡泡</h2><p>陪你一道一道，慢慢学。</p><p>学习助手功能将在后续版本加入。</p><button id="closeBubble">收起</button></aside><script>
const sessionKey='advance-study-'+new Date().toISOString().slice(0,10);let session={answers:{},submitted:[],notes:{},noteShared:{}};try{session=Object.assign(session,JSON.parse(localStorage.getItem(sessionKey)||'{}'))}catch{};session.answers={};session.submitted=[];const saveSession=()=>{try{localStorage.setItem(sessionKey,JSON.stringify(session))}catch{}};const questions=[{stem:'请选择最恰当的选项，补全下面的句子。',sentence:'If I were you, I _____ take a short break.',options:['will','can','may','would'],answer:3,explanation:'本题考查虚拟语气。If I were you 表示与现在事实相反的假设，主句使用“would + 动词原形”。因此应选择 D，would。'},{stem:'请选择最恰当的选项，补全下面的句子。',sentence:'She has lived in this city _____ 2020.',options:['for','since','during','until'],answer:1,explanation:'since 后接过去的具体时间点，常与现在完成时连用。2020 是时间点，因此选择 B，since。'},{stem:'请选择最恰当的选项，补全下面的句子。',sentence:'This is the book _____ I told you about.',options:['who','where','when','that'],answer:3,explanation:'先行词 the book 指物，关系代词在定语从句中作 about 的宾语，可以使用 that 或 which。因此选择 D，that。'}];let current=0,activeTab='analysis';const answers=[0,1,2].map(i=>null),submitted=[0,1,2].map(i=>false),notes=[0,1,2].map(i=>session.notes[i]||''),noteShared=[0,1,2].map(i=>Boolean(session.noteShared[i]));const practiceTips=['看到 If I were you 这类与现在事实相反的假设，先检查主句能否使用 would + 动词原形。','遇到表示持续时间的题，先判断空格后是时间点还是时间段：since 接时间点，for 接时间段。','定语从句先找先行词，再判断它指人还是物、在从句中充当什么成分。'];const letters=['A','B','C','D'];const escapeHtml=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const panel=document.querySelector('#panel'),details=document.querySelector('.details');const demoPosts=[[{name:'林同学',avatar:'林',body:'since 后面接具体时间点，和现在完成时一起记更牢。',likes:2},{name:'Mia',avatar:'M',body:'我会用“从那时起”来记 since，for 则接一段时长。',likes:1}],[],[]];function renderPanel(){document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.tab===activeTab;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1});panel.setAttribute('aria-labelledby','tab-'+activeTab);if(activeTab==='analysis'){const q=questions[current];panel.innerHTML='<div class="answer"><span>正确答案<b>'+letters[q.answer]+'</b></span><span>你的答案<b class="'+(answers[current]===q.answer?'':'wrong')+'">'+letters[answers[current]]+'</b></span></div><p class="explanation">'+q.explanation+'</p><div class="tips-card"><span class="tips-title">泡泡总结 / 小 tips</span><p>'+practiceTips[current]+'</p><small>目前为示例技巧，未来由泡泡结合你的作答生成个性化总结。</small></div>'}else if(activeTab==='notes'){panel.innerHTML='<textarea class="notes" aria-label="本题笔记" placeholder="记下这道题的思路或易错点……"></textarea><label class="share-note"><input type="checkbox" id="shareNote"><span>同意将这条笔记展示在讨论区</span></label>';const input=panel.querySelector('textarea'),share=panel.querySelector('#shareNote');input.value=notes[current];share.checked=noteShared[current];input.oninput=()=>{notes[current]=input.value;session.notes[current]=input.value;saveSession()};share.onchange=()=>{noteShared[current]=share.checked;session.noteShared[current]=share.checked;saveSession()}}else{const posts=[...demoPosts[current]];if(noteShared[current]&&notes[current].trim())posts.unshift({name:localStorage.getItem('advance-demo-name')||'我',avatar:(localStorage.getItem('advance-demo-name')||'我').slice(0,1),body:notes[current].trim(),likes:0,own:true});panel.innerHTML=posts.length?'<div class="discussion-list">'+posts.map((post,i)=>'<article class="post"><div class="post-head"><div class="post-avatar">'+escapeHtml(post.avatar)+'</div><div><span class="post-name">'+escapeHtml(post.name)+'</span>'+(post.own?'':'<span class="post-kind">示例讨论</span>')+'</div></div><p class="post-body">'+escapeHtml(post.body)+'</p><div class="post-actions"><button type="button" data-reply="'+i+'" aria-label="回复'+post.name+'">▱ 回复</button><button type="button" data-like="'+i+'" aria-pressed="false" aria-label="点赞'+post.name+'">♡ '+post.likes+'</button></div><div class="reply-box" data-reply-box="'+i+'" hidden><input aria-label="回复内容" placeholder="写下你的回复"><button type="button" data-send="'+i+'">发送</button></div></article>').join('')+'</div>':'<p class="explanation">还没有公开的笔记或讨论。</p>';panel.querySelectorAll('[data-like]').forEach(btn=>btn.onclick=()=>{const liked=btn.getAttribute('aria-pressed')==='true';btn.setAttribute('aria-pressed',String(!liked));const i=Number(btn.dataset.like),count=posts[i].likes+(liked?-1:1);btn.textContent='♥ '+count});panel.querySelectorAll('[data-reply]').forEach(btn=>btn.onclick=()=>{const box=panel.querySelector('[data-reply-box="'+btn.dataset.reply+'"]');box.hidden=!box.hidden;if(!box.hidden)box.querySelector('input').focus()});panel.querySelectorAll('[data-send]').forEach(btn=>btn.onclick=()=>{const box=btn.closest('.reply-box'),input=box.querySelector('input');if(input.value.trim()){const note=document.createElement('p');note.className='muted';note.textContent='我回复：'+input.value.trim();box.before(note);input.value='';box.hidden=true}})}}
function render(){const q=questions[current];document.querySelector('#number').textContent=String(current+1).padStart(2,'0');document.querySelector('#questionSelect').value=current;document.querySelector('#stem').textContent=q.stem;const line=document.createElement('span');line.style.cssText='display:block;margin-top:12px;font-weight:400';line.textContent=q.sentence;document.querySelector('#stem').append(line);document.querySelector('#options').innerHTML=q.options.map((v,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'" '+(answers[current]===i?'checked':'')+(submitted[current]?' disabled':'')+'><span class="letter">'+letters[i]+'</span><span>'+v+'</span></label>').join('');document.querySelectorAll('[name=answer]').forEach(r=>r.onchange=()=>{answers[current]=Number(r.value);session.answers[current]=answers[current];saveSession();activeTab='analysis';renderPanel();document.querySelector('#submitAnswer').disabled=false});document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===questions.length-1;details.hidden=!submitted[current];document.querySelector('#submitAnswer').disabled=submitted[current]||answers[current]===null;renderPanel()}function go(index){current=index;activeTab='analysis';render()}document.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);document.querySelector('#submitAnswer').onclick=()=>{if(answers[current]===null)return;submitted[current]=true;session.submitted[current]=true;saveSession();document.querySelector('#submitAnswer').disabled=true;document.querySelectorAll('[name=answer]').forEach(r=>r.disabled=true);activeTab='analysis';details.hidden=false;renderPanel()};document.querySelector('#questionSelect').onchange=e=>go(Number(e.target.value));document.querySelectorAll('.tab').forEach((t,i)=>{t.onclick=()=>{activeTab=t.dataset.tab;renderPanel()};t.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('.tab')];const n=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;activeTab=tabs[n].dataset.tab;renderPanel();tabs[n].focus()}}});const bubble=document.querySelector('#bubble'),bubblePanel=document.querySelector('#bubblePanel');let drag=null,moved=false;function position(x,y){bubble.style.left=Math.max(8,Math.min(innerWidth-bubble.offsetWidth-8,x))+'px';bubble.style.top=Math.max(8,Math.min(innerHeight-bubble.offsetHeight-8,y))+'px';bubble.style.right='auto';bubble.style.bottom='auto'}bubble.onpointerdown=e=>{if(e.button!==0)return;const r=bubble.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,left:r.left,top:r.top};moved=false;bubble.setPointerCapture(e.pointerId)};bubble.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)moved=true;if(moved)position(drag.left+dx,drag.top+dy)};bubble.onpointerup=()=>drag=null;bubble.onpointercancel=()=>{drag=null;moved=true};bubble.onclick=()=>{if(moved){moved=false;return}bubblePanel.hidden=!bubblePanel.hidden;bubble.setAttribute('aria-expanded',!bubblePanel.hidden)};document.querySelector('#closeBubble').onclick=()=>{bubblePanel.hidden=true;bubble.setAttribute('aria-expanded',false);bubble.focus()};bubble.onkeydown=e=>{if(e.key.startsWith('Arrow')){e.preventDefault();const r=bubble.getBoundingClientRect();position(r.left+(e.key==='ArrowRight'?16:e.key==='ArrowLeft'?-16:0),r.top+(e.key==='ArrowDown'?16:e.key==='ArrowUp'?-16:0))}};window.onresize=()=>{const r=bubble.getBoundingClientRect();position(r.left,r.top)};render();
</script><script src="interaction-tools.js?v=20261005b"></script><script src="phone-embed.js?v=20261011-canvas"></script></body></html>
